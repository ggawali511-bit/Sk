<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabla Study App</title>
<style>
:root{--bg:#fff8ee;--fg:#2b1d12;--ac:#b4501e;--cd:#fff;--bd:#e6d3bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c140e;--fg:#f5e8d8;--ac:#e8803f;--cd:#2a1e15;--bd:#4a3626}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans Devanagari",sans-serif;line-height:1.6}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--ac);color:#fff;position:sticky;top:0;z-index:5}
h1{font-size:19px;margin:0}#mb{background:none;border:0;color:#fff;font-size:26px;cursor:pointer;line-height:1}
#menu{display:none;position:absolute;right:10px;top:48px;background:var(--cd);border:1px solid var(--bd);border-radius:10px;min-width:210px;box-shadow:0 4px 14px #0004;z-index:9}
#menu button{display:block;width:100%;text-align:left;padding:12px 16px;background:none;border:0;color:var(--fg);font:inherit;cursor:pointer}
#menu.on{display:block}main{padding:14px;max-width:760px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;cursor:pointer;margin-bottom:10px}
.card b{color:var(--ac)}.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer;margin:4px 4px 4px 0}
.paper{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:18px}
.back{background:none;border:0;color:var(--ac);font:inherit;cursor:pointer;padding:0 0 8px}
input,textarea{width:100%;padding:10px;font:inherit;background:var(--cd);color:var(--fg);border:1px solid var(--bd);border-radius:8px;margin:4px 0}
#note{min-height:130px;background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px;overflow:auto}
#note img{max-width:100%}.kb{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.kb button{min-width:36px;height:40px;border:1px solid var(--bd);border-radius:7px;background:var(--cd);color:var(--fg);font-size:17px;cursor:pointer}
.tabs button{opacity:.6}.tabs button.on{opacity:1}
canvas{width:100%;height:170px;background:#fff;border:1px solid var(--bd);border-radius:10px;touch-action:none}
@media print{header,.noprint{display:none!important}.paper{border:0}body{background:#fff;color:#000}}
</style></head><body>
<header><h1>🥁 Tabla Study App</h1><button id="mb" aria-label="Menu">⋮</button>
<div id="menu"><button data-v="books">📚 Books &amp; Exam Papers</button><button data-v="taal">🥁 Taals &amp; Bols</button><button data-v="artists">🎶 Artists &amp; Search</button><button data-v="kb">⌨️ Keyboard &amp; Handwriting</button></div></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const lv=["Prarambhik","Praveshika Pratham","Praveshika Purna","Madhyama Pratham","Madhyama Purna","Visharad Pratham","Visharad Purna","Alankar Pratham","Alankar Purna","Mixed Practice"];
const tals=[["Teentaal",16,"4+4+4+4","Tali 1, 5, 13 · Khali 9","Dha Dhin Dhin Dha | Dha Dhin Dhin Dha | Dha Tin Tin Ta | Ta Dhin Dhin Dha"],

["Ektaal",12,"2+2+2+2+2+2","Tali 1, 5, 9, 11 · Khali 3, 7","Dhin Dhin | DhaGe TiRaKiTa | Tu Na | Kat Ta | DhaGe TiRaKiTa | Dhi Na"],
["Rupak",7,"3+2+2","Khali 1 · Tali 4, 6","Tin Tin Na | Dhi Na | Dhi Na"],
["Dadra",6,"3+3","Tali 1 · Khali 4","Dha Dhi Na | Dha Ti Na"],
["Kaharwa",8,"4+4","Tali 1 · Khali 5","Dha Ge Na Ti | Na Ka Dhi Na"],
["Chautaal",12,"2+2+2+2+2+2","Tali 1, 5, 9, 11 · Khali 3, 7","Dha Dha | Din Ta | Kit Dha | Din Ta | Tit Kat | Gadi Gana"],
["Dhamar",14,"5+2+3+4","Tali 1, 6, 11 · Khali 8",""],
["Teevra",7,"3+2+2","Tali 1, 4, 6",""],
["Deepchandi",14,"3+4+3+4","Tali 1, 4, 11 · Khali 8","Dha Dhin – | Dha Dha Dhin – | Ta Tin – | Dha Dha Dhin –"]];
const tp=["Origin of the Tabla","Parts of the Tabla","Bols and Theka","Matra, Vibhag, Tali and Khali","Laya and Layakari","Kayda and Palte","Tukda and Mukhda","Tihai","Rela","Gat","Paran","Accompaniment (Sangat)"];
const ex=["First","Second","Third","Fourth","Fifth (Final)"];
const ar=[["Zakir Hussain","World-famous tabla maestro, born in 1951 in Mumbai. His father and guru was Ustad Alla Rakha. He performed on stage from a very young age. He carried the Punjab gharana tradition across the world. The fusion band Shakti made him famous globally. He received the Padma Shri, Padma Bhushan and Padma Vibhushan, and several Grammy awards. He passed away on 15 December 2024 in San Francisco."],
["Ustad Alla Rakha","Great tabla player of the Punjab gharana, born in 1919 near Jammu. He accompanied Pandit Ravi Shankar for many years. He helped give the tabla the status of a solo instrument. Zakir Hussain is his son and disciple. He passed away in 2000."],
["Pandit Kishan Maharaj","Famous tabla player of the Benares gharana (1923–2008). His playing was powerful, prepared and rich in laya. He accompanied many leading vocalists and instrumentalists. He received the Padma Shri and Padma Vibhushan."],
["Pandit Samta Prasad","Leading Benares gharana tabla player, known as 'Gudai Maharaj' (1921–1994). He excelled in both solo and accompaniment. He was known for clear, sweet and full-bodied bols."],
["Pandit Suresh Talwalkar","Renowned tabla player and teacher from Maharashtra, born in Mumbai. He trained under Pandit Laxman (Nana) Mule and Pandit Nikhil Ghosh. He is respected for solo, vocal, instrumental and dance accompaniment, and has trained many students."],
["Pandit Nikhil Ghosh","Tabla player and teacher (1918–1995). He founded the Sangit Mahabharati institute in Mumbai. His systematic teaching method produced many well-known students."],
["Pakhawaj – Pandit Bhavani Shankar","The pakhawaj is an ancient percussion instrument that accompanies Dhrupad and Dhamar singing. Pandit Bhavani Shankar is a well-known pakhawaj artist. Its deep, solemn tone is its main feature."],
["Harmonium – Pandit Appa Jalgaonkar","A leading harmonium accompanist and soloist from Maharashtra. By accompanying singers with beautiful support and by solo playing, he raised the harmonium to a respected place in classical music."]];
const inst="Tabla · Pakhawaj · Harmonium · Sitar · Flute (Bansuri) · Sarod · Santoor · Sarangi · Dholak · Violin · Shehnai";
const ca=()=>{try{return JSON.parse(localStorage.getItem('ca')||'[]')}catch(e){return[]}};
const v={
books(){app.innerHTML='<h2>📚 Tabla Books</h2><div class="grid">'+lv.map((l,i)=>`<div class="card" onclick="book(${i})"><b>Book ${i+1}</b><br>${l}</div>`).join('')+'</div>'},
taal(){app.innerHTML='<h2>🥁 Taals &amp; Bols</h2>'+tals.map((t,i)=>`<div class="card" style="cursor:auto"><b>${i+1}. ${t[0]}</b> – ${t[1]} matras<br>Vibhag: ${t[2]}<br>${t[3]}<br>${t[4]?'<b>Theka:</b> '+t[4]:'<i>Theka bols: learn from your guru / syllabus book.</i>'}</div>`).join('')},
artists(){draw('')},kb:kbv};
function draw(q){const all=ca().concat(ar).filter(a=>(a[0]+a[1]).toLowerCase().includes(q.toLowerCase()));

const set={40:[1,2,3,4,6],30:[1,2,3],20:[2,4,6]}[m],tm={40:'1 hour',30:'45 minutes',20:'30 minutes'}[m];
app.innerHTML=`<button class="back noprint" onclick="book(${b})">← Exams</button><div class="noprint">Marks: ${[20,30,40].map(x=>`<button class="btn" onclick="paper(${b},${n},${x})" style="${x==m?'':'opacity:.5'}">${x}</button>`).join('')}</div><div class="paper"><h2 style="text-align:center">Tabla – ${lv[b]} (Book ${b+1})<br>${ex[n]} Exam</h2><p>Time: ${tm} &nbsp; Total marks: ${m}</p><ol>${set.map(i=>`<li>${q[i][0]} (${q[i][1]} marks)</li>`).join('')}</ol></div><button class="btn noprint" onclick="print()">📄 Save as PDF / Print</button><p class="noprint" style="font-size:13px">In the print window choose "Save as PDF".</p>`}
const L={
"Marathi":"अ आ इ ई उ ऊ ऋ ए ऐ ओ औ अं अः क ख ग घ ङ च छ ज झ ञ ट ठ ड ढ ण त थ द ध न प फ ब भ म य र ल व श ष स ह ळ क्ष ज्ञ ा ि ी ु ू ृ े ै ो ौ ं ः ् ॲ ऑ".split(' '),
"Hindi":"अ आ इ ई उ ऊ ऋ ए ऐ ओ औ अं अः क ख ग घ ङ च छ ज झ ञ ट ठ ड ढ ण त थ द ध न प फ ब भ म य र ल व श ष स ह क्ष त्र ज्ञ क़ ख़ ग़ ज़ ड़ ढ़ फ़ ा ि ी ु ू ृ े ै ो ौ ं ः ् ॉ ।".split(' '),
"English":"q w e r t y u i o p a s d f g h j k l z x c v b n m 1 2 3 4 5 6 7 8 9 0 . , ? ! - ( )".split(' ')};
function kbv(){app.innerHTML=`<h2>⌨️ Keyboard &amp; Handwriting</h2><p>Write notes or questions here. Pick a keyboard language or write by hand.</p><div id="note" contenteditable inputmode="none"></div>
<div class="tabs noprint">${Object.keys(L).map((k,i)=>`<button class="btn ${i?'':'on'}" data-l="${k}">${k}</button>`).join('')}</div><div class="kb" id="keys"></div>
<div class="kb"><button style="min-width:90px" id="sp">Space</button><button id="bk">⌫</button><button id="en">↵</button></div>
<h3>✍️ Write by hand</h3><canvas id="cv"></canvas><button class="btn" id="ins">Add to note</button><button class="btn" id="clr">Clear</button>
<p style="font-size:13px">Note: handwriting is added to the note as a picture; it is not converted to text.</p>`;
const n=$('#note'),k=$('#keys'),ins=t=>{n.focus();document.execCommand('insertText',false,t)};
const dr=l=>{k.innerHTML=L[l].map(c=>`<button>${c}</button>`).join('')};dr("English");
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('on'));b.classList.add('on');dr(b.dataset.l)});
document.querySelector('.tabs button').classList.remove('on');document.querySelector('[data-l="English"]').classList.add('on');
app.addEventListener('pointerdown',e=>{if(e.target.closest('.kb button'))e.preventDefault()});
k.onclick=e=>{if(e.target.tagName=='BUTTON')ins(e.target.textContent)};
$('#sp').onclick=()=>ins(' ');$('#en').onclick=()=>document.execCommand('insertLineBreak');$('#bk').onclick=()=>{n.focus();document.execCommand('delete')};

cv.onpointerdown=e=>{d=1;cv.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};
cv.onpointermove=e=>{if(d){x.lineTo(...p(e));x.stroke()}};cv.onpointerup=()=>d=0;
$('#clr').onclick=()=>x.clearRect(0,0,cv.width,cv.height);
$('#ins').onclick=()=>{const i=new Image();i.src=cv.toDataURL();i.style.height='60px';n.appendChild(i);x.clearRect(0,0,cv.width,cv.height)}}
$('#mb').onclick=()=>$('#menu').classList.toggle('on');
$('#menu').onclick=e=>{const k=e.target.dataset.v;if(k){v[k]();$('#menu').classList.remove('on')}};
let LG='en';try{LG=localStorage.getItem('lg')||'en'}catch(e){}

en:{t:'Tabla Study App',mb:'📚 Books & Exam Papers',mt:'🥁 Taals & Bols',ma:'🎶 Artists & Search',mk:'⌨️ Keyboard & Handwriting',ml:'⚙️ Settings for Language',bh:'Tabla Books',bk:'Book',back:'← Back',ex:['First','Second','Third','Fourth','Fifth (Final)'],exs:'Exam',qp:'Question paper',mw:'Marks',tot:'Total marks',tm:['1 hour','45 minutes','30 minutes'],pdf:'📄 Save as PDF / Print',pdfh:'In the print window choose "Save as PDF".',th:'Theka',no:'Theka bols: learn from your guru / syllabus book.',vib:'Vibhag',mat:'matras',ah:'Artists',inst:'Instruments',ph:'🔍 Search artist or instrument',add:'+ Add an artist',nm:'Artist name',inf:'Information',sv:'Save artist',none:'No artist found. Add one above.',kh:'Keyboard & Handwriting',kn:'Write notes or questions here. Pick a keyboard language or write by hand.',sp:'Space',hw:'Write by hand',ia:'Add to note',cl:'Clear',hint:'Note: handwriting is added to the note as a picture; it is not converted to text.',lh:'Settings for Language',lc:'Choose the app language and press OK.',ok:'OK'},

const u=k=>UI[LG][k],E=()=>LG=='en';
